appId: com.amazon-monitor.app
productName: Amazon Price Monitor
copyright: Copyright (c) 2026

directories:
  output: dist

files:
  - src/**/*
  - assets/**/*
  - package.json

# better-sqlite3 ships a native `.node` binary that Node cannot load
# from inside an asar archive — the file has to sit on the real
# filesystem at runtime. asarUnpack extracts the whole package out
# of the archive during packaging so `require('better-sqlite3')`
# works at runtime without any user-facing error.
asarUnpack:
  - "node_modules/better-sqlite3/**/*"

win:
  target:
    - target: nsis
      arch: [x64]
  # Uncomment after placing an .ico (256×256 recommended) at assets/icon.ico
  # icon: assets/icon.ico
  artifactName: "${productName}-${version}-win.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  # Uncomment after placing a matching .icns at assets/icon.icns
  # icon: assets/icon.icns
  category: public.app-category.finance
  artifactName: "${productName}-${version}-mac.${ext}"

dmg:
  artifactName: "${productName}-${version}.dmg"
