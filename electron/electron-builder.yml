appId: com.amazon-monitor.app
productName: Amazon Price Monitor
copyright: Copyright (c) 2026

directories:
  output: dist

files:
  - src/**/*
  - assets/**/*
  - package.json

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.ico
  artifactName: "${productName}-${version}-win.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: assets/icon.icns
  category: public.app-category.finance
  artifactName: "${productName}-${version}-mac.${ext}"

dmg:
  artifactName: "${productName}-${version}.dmg"

# better-sqlite3 is a native module — electron-builder must include
# the correct prebuilt binary for the target platform.
electronDownload:
  mirror: "https://github.com/nicedoc/electron/releases/download/v"
